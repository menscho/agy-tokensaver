<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="agy-tokensaver HUD Preview">
  <defs>
    <style>
      .t { font-family: "Google Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <!-- Outer window chrome (matches exact Antigravity screenshot) -->
  <rect width="960" height="520" rx="14" fill="#111114"/>
  <rect x="0.5" y="0.5" width="959" height="519" rx="13.5" fill="none" stroke="#222227"/>

  <!-- Left Sidebar (#111114) -->
  <text x="20" y="34" class="t" font-size="12" font-weight="500" fill="#8e8e98">Antigravity</text>
  <rect x="14" y="48" width="146" height="30" rx="7" fill="#16161b" stroke="#25252a"/>
  <text x="26" y="67" class="t" font-size="12.5" fill="#ececef">+  New Conversation</text>
  <text x="26" y="102" class="t" font-size="12.5" fill="#8e8e98">Automations</text>
  <text x="26" y="128" class="t" font-size="12.5" fill="#8e8e98">Customizations</text>

  <text x="20" y="164" class="t" font-size="11" fill="#5e5e68">Plugins</text>
  <!-- Active agy-tokensaver Sidebar Item with minimal monochrome stroke icon -->
  <rect x="12" y="174" width="150" height="32" rx="7" fill="#1b1b20" stroke="#25252a"/>
  <g transform="translate(22, 181) scale(0.14)" fill="none">
    <path d="M64 22L24 44L64 66L104 44L64 22Z" stroke="#ececef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 64L64 86L104 64" stroke="#ececef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 84L64 106L104 84" stroke="#8e8e98" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="46" y="194" class="t" font-size="12.5" font-weight="500" fill="#ececef">agy-tokensaver</text>
  <text x="26" y="492" class="t" font-size="12.5" fill="#8e8e98">Settings</text>

  <!-- Main Viewport (#070708 rounded inner canvas, matching Antigravity) -->
  <rect x="176" y="12" width="772" height="496" rx="12" fill="#070708" stroke="#1e1e23"/>

  <!-- Page Header -->
  <text x="212" y="52" class="t" font-size="19" font-weight="500" fill="#ececef">agy-tokensaver</text>
  <text x="212" y="72" class="t" font-size="12" fill="#8e8e98">Quota savings, adaptive rollover, and session archive</text>

  <!-- Live status + segmented control -->
  <circle cx="574" cy="54" r="3" fill="#4ade80"/>
  <text x="584" y="58" class="t" font-size="11.5" fill="#8e8e98">Cache warm (128s)</text>
  <rect x="698" y="38" width="218" height="30" rx="8" fill="#111114" stroke="#222227"/>
  <rect x="701" y="41" width="70" height="24" rx="6" fill="#1c1c22"/>
  <text x="736" y="57" class="t" font-size="12" font-weight="500" fill="#ececef" text-anchor="middle">Overview</text>
  <text x="806" y="57" class="t" font-size="12" fill="#8e8e98" text-anchor="middle">Archive</text>
  <text x="876" y="57" class="t" font-size="12" fill="#8e8e98" text-anchor="middle">Updates</text>
  <line x1="212" y1="86" x2="916" y2="86" stroke="#1c1c22"/>

  <!-- Section 1: Total Savings -->
  <text x="212" y="110" class="t" font-size="12.5" font-weight="500" fill="#ececef">Total Savings</text>
  <text x="916" y="110" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">62 sessions · 3,380 turns</text>
  <rect x="212" y="120" width="704" height="86" rx="11" fill="#0d0d11" stroke="#222227"/>
  <line x1="447" y1="120" x2="447" y2="206" stroke="#222227"/>
  <line x1="681" y1="120" x2="681" y2="206" stroke="#222227"/>

  <text x="230" y="143" class="t" font-size="11.5" fill="#8e8e98">Average quota saved</text>
  <text x="230" y="174" class="t" font-size="25" font-weight="500" fill="#4ade80">-34.0%</text>
  <text x="230" y="193" class="t" font-size="11.5" fill="#8e8e98">less quota used · 31.5M units</text>

  <text x="465" y="143" class="t" font-size="11.5" fill="#8e8e98">More token usage</text>
  <text x="465" y="174" class="t" font-size="25" font-weight="500" fill="#ececef">+51.5%</text>
  <text x="465" y="193" class="t" font-size="11.5" fill="#8e8e98">extra capacity from same quota</text>

  <text x="699" y="143" class="t" font-size="11.5" fill="#8e8e98">Total tokens saved</text>
  <text x="699" y="174" class="t" font-size="25" font-weight="500" fill="#ececef">395.2M</text>
  <text x="699" y="193" class="t" font-size="11.5" fill="#8e8e98">64.2% fewer total tokens</text>

  <!-- Section 2: Savings Breakdown -->
  <text x="212" y="232" class="t" font-size="12.5" font-weight="500" fill="#ececef">Savings Breakdown</text>
  <text x="916" y="232" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">Exact counts &amp; percentages</text>
  <rect x="212" y="242" width="704" height="142" rx="11" fill="#0d0d11" stroke="#222227"/>
  <text x="228" y="264" class="t" font-size="11.5" fill="#8e8e98">Category</text>
  <text x="560" y="264" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">Saved</text>
  <text x="735" y="264" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">Savings %</text>
  <text x="900" y="264" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">Actual Used</text>
  <line x1="212" y1="274" x2="916" y2="274" stroke="#222227"/>

  <text x="228" y="296" class="t" font-size="12.5" fill="#ececef">Input tokens <tspan fill="#8e8e98">(uncached)</tspan></text>
  <text x="560" y="296" class="m" font-size="12" fill="#ececef" text-anchor="end">12.3M</text>
  <text x="735" y="296" class="m" font-size="12" fill="#4ade80" text-anchor="end">-34.9%</text>
  <text x="900" y="296" class="m" font-size="12" fill="#8e8e98" text-anchor="end">35.1M</text>
  <line x1="212" y1="306" x2="916" y2="306" stroke="#1a1a1f"/>

  <text x="228" y="328" class="t" font-size="12.5" fill="#ececef">Cache tokens <tspan fill="#8e8e98">(94.2% hit rate)</tspan></text>
  <text x="560" y="328" class="m" font-size="12" fill="#ececef" text-anchor="end">380.4M</text>
  <text x="735" y="328" class="m" font-size="12" fill="#4ade80" text-anchor="end">-66.6%</text>
  <text x="900" y="328" class="m" font-size="12" fill="#8e8e98" text-anchor="end">571.6M</text>
  <line x1="212" y1="338" x2="916" y2="338" stroke="#1a1a1f"/>

  <rect x="213" y="339" width="702" height="44" rx="0" fill="#141419"/>
  <text x="228" y="365" class="t" font-size="12.5" font-weight="500" fill="#ececef">Total quota <tspan fill="#8e8e98" font-weight="400">(1× in · 0.05× cache · 6× out)</tspan></text>
  <text x="560" y="365" class="m" font-size="12" font-weight="500" fill="#4ade80" text-anchor="end">31.5M units</text>
  <text x="735" y="365" class="m" font-size="12" font-weight="500" fill="#4ade80" text-anchor="end">-34.0% (+51.5%)</text>
  <text x="900" y="365" class="m" font-size="12" font-weight="500" fill="#ececef" text-anchor="end">92.6M units</text>

  <!-- Section 3: Auto-Rollover -->
  <text x="212" y="410" class="t" font-size="12.5" font-weight="500" fill="#ececef">Auto-Rollover &amp; Active Session</text>
  <text x="916" y="410" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">~2.4k/turn cache cost</text>
  <rect x="212" y="420" width="704" height="72" rx="11" fill="#0d0d11" stroke="#222227"/>
  <text x="228" y="443" class="t" font-size="12.5" font-weight="500" fill="#ececef">48k / 110k auto cap</text>
  <text x="900" y="443" class="t" font-size="11.5" fill="#8e8e98" text-anchor="end">Warm hit 96.4% · 0 drops · 18 turns</text>
  <rect x="228" y="454" width="672" height="4" rx="2" fill="#25252a"/>
  <rect x="228" y="454" width="292" height="4" rx="2" fill="#4ade80"/>
  <text x="228" y="480" class="t" font-size="11.5" fill="#8e8e98">Archive Only (default) · saves compact recaps automatically · switch to Smart Auto anytime</text>
</svg>
