  <text x="36" y="319" class="t" font-size="11" fill="#5e5e68">each of 65 sessions weighted equally</text>
  <rect x="267.0" y="293" width="3.0" height="12" rx="3" fill="#f87171"/>
  <text x="276.0" y="303" class="m" font-size="11.5" fill="#f87171">+0.1%</text>
  <rect x="626.0" y="293" width="3.0" height="12" rx="3" fill="#f87171"/>
