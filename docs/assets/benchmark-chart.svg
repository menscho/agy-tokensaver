  <text x="36" y="281" class="t" font-size="11" fill="#5e5e68">8 sessions · avg peak 479k</text>
  <rect x="270.0" y="255" width="4.6" height="12" rx="3" fill="#4ade80"/>
  <text x="280.6" y="265" class="m" font-size="11.5" fill="#4ade80">-0.6%</text>
