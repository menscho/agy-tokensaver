  <text x="36" y="380" class="t" font-size="13" font-weight="500" fill="#ececef">Total quota-weighted</text>
  <text x="36" y="395" class="t" font-size="11" fill="#5e5e68">aggregate replayed / actual quota</text>
  <rect x="270.0" y="369" width="5.6" height="12" rx="3" fill="#4ade80"/>
  <text x="281.6" y="379" class="m" font-size="11.5" font-weight="500" fill="#4ade80">-0.7%</text>
  <rect x="629.0" y="369" width="135.8" height="12" rx="3" fill="#4ade80"/>
  <text x="770.8" y="379" class="m" font-size="11.5" font-weight="500" fill="#4ade80">-17.1%</text>
  <text x="36" y="466" class="t" font-size="10.5" fill="#5e5e68">Signed quota delta (negative = less quota). Plugin prompt overhead (433 tok/turn) charged on every turn. Before and after use the same causal rollover simulator (17k cold start + 8k re-read tax).</text>
</svg>
