<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="2-Mode Real-Session Benchmark">
  <defs><style>.t{font-family:"Google Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
  <rect width="960" height="540" rx="14" fill="#070708"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="13.5" fill="none" stroke="#222227"/>
  <text x="32" y="36" class="t" font-size="16.5" font-weight="500" fill="#ececef">2-Mode Real-Session Benchmark · 68 sessions, 3,705 turns (102.7M quota units)</text>
  <text x="32" y="56" class="t" font-size="11.5" fill="#8e8e98">python3 scripts/benchmark.py --modes · exact per-turn tokens (1× in + 0.05× cache + 6× out) · 383 tok/turn prompt overhead charged</text>
  <rect x="32" y="74" width="436" height="106" rx="10" fill="#0d0d11" stroke="#222227"/>
  <text x="48" y="96" class="t" font-size="12" font-weight="500" fill="#4ade80">MODE 1 · ZERO QUALITY LOSS (DEFAULT)</text>
  <text x="452" y="96" class="m" font-size="11" fill="#4ade80" text-anchor="end">0.0% quality loss</text>
  <text x="48" y="130" class="m" font-size="22" font-weight="500" fill="#ececef">-0.7% avg quota</text>
  <text x="452" y="128" class="m" font-size="12" fill="#8e8e98" text-anchor="end">-76.4% noisy tasks</text>
  <text x="48" y="152" class="t" font-size="11.5" fill="#8e8e98">217,668 tool tokens removed · lossless JSON CSV, grep/SSH hoisting,</text>
  <text x="48" y="168" class="t" font-size="11.5" fill="#5e5e68">Merlin chunk dedupe, loop breaker, PowerShell tables, Archive-Only handoffs</text>
  <rect x="492" y="74" width="436" height="106" rx="10" fill="#0d0d11" stroke="#222227"/>
  <text x="508" y="96" class="t" font-size="12" font-weight="500" fill="#f59e0b">MODE 2 · SMALL QUALITY LOSS (OPT-IN)</text>
  <text x="912" y="96" class="m" font-size="11" fill="#f59e0b" text-anchor="end">~0.1–1.0% risk</text>
  <text x="508" y="130" class="m" font-size="22" font-weight="500" fill="#ececef">-24.2% to -28.8%</text>
  <text x="912" y="128" class="m" font-size="12" fill="#8e8e98" text-anchor="end">up to -44.3% UB</text>
  <text x="508" y="152" class="t" font-size="11.5" fill="#8e8e98">321,903 tool tokens cut · Anchored Auto-Handoff (-18.0% exact live)</text>
  <text x="508" y="168" class="t" font-size="11.5" fill="#5e5e68">+ Compact Reads (120L/140L) + Concise Output (-20%..-35% on 6× output*)</text>
  <text x="32" y="206" class="t" font-size="12" font-weight="500" fill="#8e8e98">TOTAL QUOTA REDUCTION BY MODE (68 REAL SESSIONS · NEGATIVE = LESS QUOTA)</text>
  <line x1="290.0" y1="214" x2="290.0" y2="482" stroke="#18181d"/>
  <text x="290.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-0%</text>
  <line x1="394.0" y1="214" x2="394.0" y2="482" stroke="#18181d"/>
  <text x="394.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-10%</text>
  <line x1="498.0" y1="214" x2="498.0" y2="482" stroke="#18181d"/>
  <text x="498.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-20%</text>
  <line x1="602.0" y1="214" x2="602.0" y2="482" stroke="#18181d"/>
  <text x="602.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-30%</text>
  <line x1="706.0" y1="214" x2="706.0" y2="482" stroke="#18181d"/>
  <text x="706.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-40%</text>
  <line x1="810.0" y1="214" x2="810.0" y2="482" stroke="#18181d"/>
  <text x="810.0" y="497" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">-50%</text>
  <text x="32" y="228" class="t" font-size="12.5" font-weight="500" fill="#ececef">Mode 1 · Zero Quality Loss</text>
  <text x="32" y="242" class="t" font-size="10.5" fill="#5e5e68">Exact replay · 0.0% quality loss (all 68 chats)</text>
  <rect x="290.0" y="218" width="7.3" height="14" rx="3" fill="#4ade80"/>
  <text x="305.3" y="229" class="m" font-size="11.5" font-weight="500" fill="#4ade80">-0.7%</text>
  <text x="32" y="272" class="t" font-size="12.5" fill="#ececef">Mode 2 · Compact Reads only</text>
  <text x="32" y="286" class="t" font-size="10.5" fill="#5e5e68">Exact replay · ~0.1–0.5% risk (Auto-Handoff OFF)</text>
  <rect x="290.0" y="262" width="10.4" height="14" rx="3" fill="#86efac"/>
  <text x="308.4" y="273" class="m" font-size="11.5" fill="#86efac">-1.0%</text>
  <text x="32" y="316" class="t" font-size="12.5" fill="#ececef">Mode 2 · + Concise Output*</text>
  <text x="32" y="330" class="t" font-size="10.5" fill="#5e5e68">Modeled -20%..-35% on 6× output · ~0.1% prose risk</text>
  <rect x="290.0" y="306" width="122.7" height="14" rx="3" fill="#f59e0b" fill-opacity="0.28"/>
  <rect x="290.0" y="306" width="74.9" height="14" rx="3" fill="#f59e0b"/>
  <text x="420.7" y="317" class="m" font-size="11.5" fill="#f59e0b">-7.2% .. -11.8%</text>
  <text x="32" y="360" class="t" font-size="12.5" fill="#ececef">Mode 2 · + Auto-Handoff (Live)</text>
  <text x="32" y="374" class="t" font-size="10.5" fill="#5e5e68">Exact causal replay · ~0.5–1% mid-debug risk</text>
  <rect x="290.0" y="350" width="187.2" height="14" rx="3" fill="#4ade80"/>
  <text x="485.2" y="361" class="m" font-size="11.5" fill="#4ade80">-18.0%</text>
  <text x="32" y="404" class="t" font-size="12.5" font-weight="500" fill="#ececef">Mode 2 · Full (Live + All)*</text>
  <text x="32" y="418" class="t" font-size="10.5" fill="#5e5e68">Exact live handoff + Compact Reads + Concise Output</text>
  <rect x="290.0" y="394" width="299.5" height="14" rx="3" fill="#4ade80" fill-opacity="0.28"/>
  <rect x="290.0" y="394" width="251.7" height="14" rx="3" fill="#4ade80"/>
  <text x="597.5" y="405" class="m" font-size="11.5" font-weight="500" fill="#4ade80">-24.2% .. -28.8%</text>
  <text x="32" y="448" class="t" font-size="12.5" font-weight="500" fill="#ececef">Mode 2 · Full (Upper Bound)*</text>
  <text x="32" y="462" class="t" font-size="10.5" fill="#5e5e68">Phase-switch resets + Compact Reads + Concise Output</text>
  <rect x="290.0" y="438" width="460.7" height="14" rx="3" fill="#34d399" fill-opacity="0.28"/>
  <rect x="290.0" y="438" width="412.9" height="14" rx="3" fill="#34d399"/>
  <text x="758.7" y="449" class="m" font-size="11.5" font-weight="500" fill="#34d399">-39.7% .. -44.3%</text>
  <line x1="32" y1="494" x2="928" y2="494" stroke="#222227"/>
  <text x="32" y="512" class="t" font-size="10.5" fill="#5e5e68">* Concise Output (Sketch-of-Thought arXiv:2503.05179 + Caveman-lite) modeled on real 30.9% (6×) output bucket (solid bar = -20%, shaded = -35%).</text>
  <text x="32" y="527" class="t" font-size="10.5" fill="#5e5e68">Exact replays charge retries, follow-up reads, and 383 tok/turn prompt overhead. Cache-drop rebuilds = 19% of baseline quota (109 idle drops).</text>
</svg>
