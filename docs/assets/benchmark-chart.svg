<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-label="Real-session replay benchmark">
  <defs><style>.t{font-family:"Google Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
  <rect width="960" height="486" rx="14" fill="#070708"/>
  <rect x="0.5" y="0.5" width="959" height="485" rx="13.5" fill="none" stroke="#222227"/>
  <text x="36" y="38" class="t" font-size="16.5" font-weight="500" fill="#ececef">Real-Session Replay · 65 local Antigravity sessions, 3,602 turns</text>
  <text x="36" y="59" class="t" font-size="11.5" fill="#8e8e98">python3 scripts/transcript_replay.py · recorded tool calls replayed through the hooks · exact per-turn tokens · quota = 1× in + 0.05× cache + 6× out</text>
  <text x="400" y="90" class="t" font-size="12" font-weight="500" fill="#8e8e98" text-anchor="middle">Hooks only · Auto-Handoff OFF</text>
  <line x1="270.0" y1="98" x2="270.0" y2="410" stroke="#18181d"/>
  <text x="270.0" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">0%</text>
  <line x1="349.7" y1="98" x2="349.7" y2="410" stroke="#18181d"/>
  <text x="349.7" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">10%</text>
  <line x1="429.3" y1="98" x2="429.3" y2="410" stroke="#18181d"/>
  <text x="429.3" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">20%</text>
  <line x1="509.0" y1="98" x2="509.0" y2="410" stroke="#18181d"/>
  <text x="509.0" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">30%</text>
  <text x="760" y="90" class="t" font-size="12" font-weight="500" fill="#8e8e98" text-anchor="middle">Hooks + Auto-Handoff (live-reachable)</text>
  <line x1="629.0" y1="98" x2="629.0" y2="410" stroke="#18181d"/>
  <text x="629.0" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">0%</text>
  <line x1="708.7" y1="98" x2="708.7" y2="410" stroke="#18181d"/>
  <text x="708.7" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">10%</text>
  <line x1="788.3" y1="98" x2="788.3" y2="410" stroke="#18181d"/>
  <text x="788.3" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">20%</text>
  <line x1="868.0" y1="98" x2="868.0" y2="410" stroke="#18181d"/>
  <text x="868.0" y="426" class="m" font-size="10.5" fill="#5e5e68" text-anchor="middle">30%</text>
