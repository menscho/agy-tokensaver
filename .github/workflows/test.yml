name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-coverage:
    name: Lint, Types & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev-only linters (runtime stays 0-dep)
        run: |
          python3 -m pip install -q ruff mypy coverage
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Python lint (ruff) and type check (mypy)
        run: |
          ruff check mcp_app scripts/*.py eval/*.py install.py tests/test_python_unit.py
          mypy mcp_app scripts/*.py eval/*.py install.py tests/test_python_unit.py
      - name: Shell lint (shellcheck)
        run: |
          shellcheck -S error tests/*.sh install.sh Install-TokenSaver.command
      - name: Python unit coverage (mcp_app >= 80%)
        run: |
          coverage run --source=mcp_app,scripts -m unittest tests/test_python_unit.py
          coverage report --include="mcp_app/*.py" --fail-under=80

  unix-suite:
    name: Full Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run all regression suites, vendor check & benchmark demo
        run: |
          bash tests/run_all.sh
          python3 scripts/benchmark.py --demo
      - name: Verify MCP server & installer
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, subprocess, tempfile
          srv = subprocess.Popen(["python3", "mcp_app/server.py"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          try:
              srv.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-03-26"}}) + "\n")
              srv.stdin.flush()
              r = json.loads(srv.stdout.readline())
              assert "result" in r and "resources" in r["result"]["capabilities"], r
              srv.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "open_token_saver", "arguments": {}}}) + "\n")
              srv.stdin.flush()
              r2 = json.loads(srv.stdout.readline())
              assert r2["result"]["structuredContent"]["config"]["mode"] == "smart_auto"
              assert r2["result"]["structuredContent"]["config"]["profile"] == "auto_handoff"
          finally:
              srv.terminate(); srv.wait(timeout=5)
          with tempfile.TemporaryDirectory() as td:
              env = {**os.environ, "HOME": td}
              p = subprocess.run(["python3", "install.py", "--cli", "--yes"], env=env, text=True, capture_output=True)
              assert p.returncode == 0, p.stdout + p.stderr
          print("MCP + installer OK")
          PYEOF

  windows-suite:
    name: Full Suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full test suites via Git Bash (matching Linux & macOS)
        shell: bash
        run: |
          bash tests/run_all.sh
          python scripts/benchmark.py --demo
      - name: Native PowerShell hook, MCP server, and Windows installer checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/handoff_pack.py . | Out-Null
          python -c @"
          import json, os, pathlib, subprocess, sys, tempfile
          srv = subprocess.Popen([sys.executable, 'mcp_app/server.py'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          try:
              srv.stdin.write(json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26'}}) + '\n')
              srv.stdin.flush()
              r = json.loads(srv.stdout.readline())
              assert 'result' in r
          finally:
              srv.terminate(); srv.wait(timeout=5)
          with tempfile.TemporaryDirectory() as td:
              env = {**os.environ, 'USERPROFILE': td, 'HOME': td}
              p = subprocess.run([sys.executable, 'install.py', '--cli', '--yes'], env=env, text=True, capture_output=True)
              assert p.returncode == 0, p.stdout + p.stderr
              cfg = json.loads((pathlib.Path(td)/'.gemini/config/plugins/token-saver/mcp_config.json').read_text())
              assert cfg['mcpServers']['token_saver_ui']['command'] == sys.executable
              hcfg = json.loads((pathlib.Path(td)/'.gemini/config/plugins/token-saver/hooks.json').read_text())
              assert sys.executable in hcfg['token-saver-read']['PreToolUse'][0]['hooks'][0]['command']
          print('Windows MCP + installer OK')
          "@
          $tmp = Join-Path $env:TEMP "agy-win-pwsh-test"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $lock = Join-Path $tmp "package-lock.json"
          ('{"lockfileVersion":3}' + "`n") * 1000 | Set-Content -Path $lock -NoNewline
          $esc = $lock.Replace('\', '\\')
          $out = ('{"toolInput":{"Path":"' + $esc + '"},"cwd":"C:\\"}') | & python -S scripts/read_hook.py
          if ($out -notmatch '"decision":"deny"') { throw "read_hook failed on Windows path: $out" }
          $target = Join-Path $tmp "sample.txt"
          "line1`nneedle_win" | Set-Content -Path $target -NoNewline
          $tesc = $target.Replace('\', '\\')
          $gout = ('{"toolInput":{"Query":"needle_win","SearchPath":"' + $tesc + '"}}') | & python -S scripts/grep_hook.py
          if ($gout -notmatch '"Includes":\["sample.txt"\]') { throw "grep_hook failed on Windows path: $gout" }
          Write-Host "Native Windows PowerShell checks OK"
