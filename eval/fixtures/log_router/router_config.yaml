# Multi-tenant Log Router Configuration
# Ordered intentionally with broad parent wildcards before specific child routes.
routes:
  - pattern: "*"
    sink: fallback_sink
    escalate_on: [CRITICAL]
    dedup_window_s: 300

  - pattern: "prod.*"
    sink: prod_default_sink
    escalate_on: [ERROR, CRITICAL]
    dedup_window_s: 120

  - pattern: "prod.payments.*"
    sink: prod_payments_sink
    escalate_on: [WARN, ERROR, CRITICAL]
    dedup_window_s: 30

  - pattern: "prod.payments.eu"
    sink: payments_eu_sink
    escalate_on: [WARN, ERROR, CRITICAL]
    dedup_window_s: 15

  - pattern: "prod.payments.us"
