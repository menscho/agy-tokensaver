[tool.ruff]
target-version = "py39"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = false
mypy_path = ["mcp_app", "scripts"]
